kind = "web"
previewPath = "/"
title = "Swim Track"
description = "Swimming records, rankings, and athlete self-service for Swim Track."
version = "1.0.0"
id = "artifacts/swimtrack-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "npm run dev"

[services.production]

[services.production.build]
args = [ "npm", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "npm", "run", "start" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "5000"

[services.production.health.startup]
path = "/health"

[services.env]
PORT = "5000"
